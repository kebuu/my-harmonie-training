<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défilement d'accords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button type="button" class="tab" role="tab" id="tab-chords-basics" aria-controls="panel-chords-basics" aria-selected="true">Chords basics</button>
</nav>

<section class="tab-panel" role="tabpanel" id="panel-chords-basics" aria-labelledby="tab-chords-basics">
<div class="app">
  <main class="stage" aria-live="polite">
    <div class="stage-head">
      <span class="brand">Défilement d'accords</span>
      <span class="counter" id="counter">Exemple</span>
    </div>

    <div class="chord" id="chord">
      <div class="chord-name" id="chordName"></div>
      <div class="chord-alt" id="chordAlt"></div>
      <div class="chord-notes" id="chordNotes"></div>
      <div class="structure" id="structure"></div>
      <p class="empty-msg" id="emptyMsg" hidden>Cochez au moins un type d'accord et une fondamentale dans les réglages.</p>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn" type="button">Démarrer</button>
      <button class="btn stop" id="stopBtn" type="button" disabled>Arrêter</button>
      <button class="btn primary" id="nextBtn" type="button" hidden>Suivant</button>
    </div>
    <p class="hint" id="hint"></p>
  </main>

  <aside class="settings" aria-label="Réglages">
    <h2>Réglages</h2>

    <fieldset>
      <legend>Défilement</legend>
      <div class="seg" role="group" aria-label="Mode de défilement">
        <button type="button" id="modeAuto" aria-pressed="true">Automatique</button>
        <button type="button" id="modeManual" aria-pressed="false">Manuel</button>
      </div>
      <div class="speed" id="speedBox">
        <label for="duration">Durée (s)
          <input type="number" id="duration" min="1" max="120" step="0.5" value="4">
        </label>
        <span class="eq">⇄</span>
        <label for="perMinute">Accords / min
          <input type="number" id="perMinute" min="0.5" max="60" step="0.5" value="15">
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notation</legend>
      <div class="seg" role="group" aria-label="Notation">
        <button type="button" id="notUS" aria-pressed="true">Américaine</button>
        <button type="button" id="notFR" aria-pressed="false">Latine</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Types d'accords</legend>
      <div id="typeList"></div>
    </fieldset>

    <fieldset>
      <legend>Fondamentales</legend>
      <div class="roots" id="rootList"></div>
      <div class="row-actions">
        <button type="button" class="linkbtn" id="rootsAll">Tout cocher</button>
        <button type="button" class="linkbtn" id="rootsNone">Tout décocher</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Affichage</legend>
      <label class="check"><input type="checkbox" id="showName" checked> Nom de l'accord</label>
      <label class="check"><input type="checkbox" id="showNotes" checked> Notes de l'accord</label>
      <label class="check"><input type="checkbox" id="showStructure" checked> Structure</label>
      <p class="legend-note">Si le nom est masqué, il apparaît pendant 1 s à la fin de chaque accord.</p>
    </fieldset>
  </aside>
</div>
</section>

<script src="tabs.js"></script>
<script src="script.js"></script>

</body>
</html>
